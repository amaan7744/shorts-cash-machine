name: Daily Shorts Generator

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 6 * * *"   # runs once daily (06:00 UTC)

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ----------------------------------------
      # 1. CHECKOUT REPO
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED so we can commit state.json back

      # ----------------------------------------
      # 2. SET UP PYTHON
      # ----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ----------------------------------------
      # 3. INSTALL SYSTEM DEPENDENCIES
      # ----------------------------------------
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ----------------------------------------
      # 4. INSTALL PYTHON DEPENDENCIES
      # ----------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------
      # 5. RUN SHORTS PIPELINE
      # ----------------------------------------
      - name: Run Shorts Pipeline
        env:
          COQUI_TOS_AGREED: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "1"
        run: |
          python main.py

      # ----------------------------------------
      # 6. UPLOAD GENERATED SHORTS
      # ----------------------------------------
      - name: Upload Shorts Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output
          path: output/shorts
          if-no-files-found: warn

      # ----------------------------------------
      # 7. COMMIT ROTATION STATE (state.json)
      # ----------------------------------------
      - name: Commit channel rotation state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "Update channel rotation state" || echo "No state change"
          git push
